name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-source:
    name: Release Source
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source of production changes
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_BRANCH" != dev ] || [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo '::error::Los cambios a main deben llegar mediante un PR desde dev del mismo repositorio.'
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: caminomanager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caminomanager/package-lock.json
      - run: npm ci
      - run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: caminomanager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caminomanager/package-lock.json
      - run: npm ci
      - run: npm run type-check

  test:
    name: Test
    needs: [lint, type-check]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: caminomanager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caminomanager/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vitest-coverage
          path: caminomanager/coverage/
          retention-days: 14

  integration:
    name: Database Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caminomanager/package-lock.json
      - run: npm ci --prefix caminomanager
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Start isolated Supabase and apply migrations
        run: supabase start
      - name: Run transactional RLS and RPC contracts
        run: npm run test:integration
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  build:
    name: Build
    needs: [lint, type-check]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: caminomanager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caminomanager/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder-key

  e2e-smoke:
    name: Playwright Smoke
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: caminomanager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caminomanager/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: placeholder-key
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-smoke
          path: |
            caminomanager/e2e/playwright-report/
            caminomanager/e2e/test-results/
          retention-days: 7

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: caminomanager
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caminomanager/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npm audit --prefix .. --package-lock-only --audit-level=critical
