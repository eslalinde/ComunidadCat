name: Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      target:
        description: Entorno que se comprobará
        type: choice
        options: [integration, production]
        default: integration
        required: true
      apply:
        description: Aplicar las migraciones pendientes (desmarcado solo comprueba)
        type: boolean
        default: false
        required: true
  push:
    branches: [main]
    # Workflow/documentation changes alone must not deploy pending SQL.
    paths:
      - "supabase/migrations/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
      - ".github/actions/supabase-migrate/**"
      - ".github/scripts/*supabase*"

permissions:
  contents: read

jobs:
  validate:
    name: Migration credential tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test .github/scripts/validate-supabase-env.test.mjs

  migrate-production:
    name: Production migration plan / apply
    needs: validate
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'production') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'check-migrations'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      EXPECTED_SUPABASE_PROJECT_ID: fkezcibdjgbqyraxnmha
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/supabase-migrate
        with:
          apply: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}

  migrate-integration:
    name: Integration migration plan / apply
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.target == 'integration') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.labels.*.name, 'check-migrations') || contains(github.event.pull_request.labels.*.name, 'run-migrations')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: supabase-integration
      cancel-in-progress: false
    env:
      EXPECTED_SUPABASE_PROJECT_ID: azfhawxpdrgrhnpgcwxa
      SUPABASE_PROJECT_ID: ${{ secrets.INTEGRATION_SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.INTEGRATION_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/supabase-migrate
        with:
          # The read-only label wins if both labels are present.
          apply: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-migrations') && !contains(github.event.pull_request.labels.*.name, 'check-migrations')) }}
