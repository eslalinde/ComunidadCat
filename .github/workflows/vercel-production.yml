name: Production Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 66.6.0

jobs:
  candidate:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node .github/scripts/release.mjs check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Wait for this commit's push checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in ci.yml web-regression.yml security.yml; do
            while true; do
              result=$(gh run list --workflow "$workflow" --event push --branch main --commit "$GITHUB_SHA" \
                --limit 1 --json status,conclusion,url)
              if jq -e '.[0].status == "completed"' <<< "$result" >/dev/null; then
                jq -e '.[0].conclusion == "success"' <<< "$result" || { echo "$result"; exit 1; }
                jq -r '.[0].url' <<< "$result" >> "$GITHUB_STEP_SUMMARY"
                break
              fi
              sleep 30
            done
          done

  windows:
    permissions:
      actions: read
      contents: read
    needs: candidate
    uses: ./.github/workflows/electron-release.yml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
      WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

  migration-plan:
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/supabase-migrate
        with:
          apply: 'false'
        env:
          EXPECTED_SUPABASE_PROJECT_ID: fkezcibdjgbqyraxnmha
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  stage-web:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      deployment: ${{ steps.stage.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Stage production build without assigning domains
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_ORG_ID:?}" "${VERCEL_PROJECT_ID:?}" "${VERCEL_TOKEN:?}"
          deployment=$(vercel deploy --prod --skip-domain --yes --meta "releaseSha=$GITHUB_SHA")
          [[ "$deployment" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "Revisar el [build de producción preparado]($deployment) del commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

  draft:
    needs: [windows, migration-plan, stage-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.draft.outputs.hashes }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-windows
          path: signed-windows
      - id: draft
        run: node .github/scripts/release.mjs draft
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish approved release
    needs: [draft, stage-web]
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
      RELEASE_HASHES: ${{ needs.draft.outputs.hashes }}
      DEPLOYMENT: ${{ needs.stage-web.outputs.deployment }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node .github/scripts/release.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Verify staged project, SHA and build status
        run: bash .github/scripts/verify-vercel.sh "${DEPLOYMENT#https://}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Apply reviewed migrations
        uses: ./.github/actions/supabase-migrate
        with:
          apply: 'true'
        env:
          EXPECTED_SUPABASE_PROJECT_ID: fkezcibdjgbqyraxnmha
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: node .github/scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Promote the reviewed build
        run: |
          if bash .github/scripts/verify-vercel.sh comunidad-cat.vercel.app; then
            echo "El dominio ya sirve el build aprobado."
          else
            vercel promote "$DEPLOYMENT" --yes
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify public web, release notes and installer download
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bash .github/scripts/verify-vercel.sh comunidad-cat.vercel.app
          version=$(node -p "require('./caminomanager/package.json').version")
          release="https://github.com/$GITHUB_REPOSITORY/releases"
          for url in "https://comunidad-cat.vercel.app/login" "$release/tag/v$version" \
            "$release/download/v$version/ComunidadCat-Cloud-$version-Setup.exe"; do
            curl --fail --silent --show-error --head --location --retry 4 "$url" >/dev/null
          done
          echo "Migraciones aplicadas. [Web verificada](https://comunidad-cat.vercel.app/login) · [Build promovido]($DEPLOYMENT) · [Release $version]($release/tag/v$version)." >> "$GITHUB_STEP_SUMMARY"
