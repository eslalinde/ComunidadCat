name: Production Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 66.6.0

jobs:
  candidate:
    outputs:
      version: ${{ steps.version.outputs.version }}
    name: Verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: version
        run: echo "version=$(node -p "require('./caminomanager/package.json').version")" >> "$GITHUB_OUTPUT"
      - run: node .github/scripts/release.mjs check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Wait for this commit's CI, web regression and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          codeql=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.path == "dynamic/github-code-scanning/codeql" and .state == "active") | .id')
          [[ "$codeql" =~ ^[0-9]+$ ]] || { echo "CodeQL activo no encontrado"; exit 1; }
          for workflow in ci.yml web-regression.yml "$codeql"; do
            event=push
            if [[ "$workflow" == "$codeql" ]]; then event=dynamic; fi
            while true; do
              result=$(gh run list --workflow "$workflow" --event "$event" --branch main --commit "$GITHUB_SHA" \
                --limit 1 --json status,conclusion,url)
              if jq -e '.[0].status == "completed"' <<< "$result" >/dev/null; then
                jq -e '.[0].conclusion == "success"' <<< "$result" || { echo "$result"; exit 1; }
                jq -r '.[0].url' <<< "$result" >> "$GITHUB_STEP_SUMMARY"
                break
              fi
              sleep 30
            done
          done

  windows:
    if: needs.candidate.outputs.version != '1.0.0'
    needs: candidate
    uses: ./.github/workflows/electron-release.yml
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
      WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

  migration-plan:
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/supabase-migrate
        with:
          apply: 'false'
        env:
          EXPECTED_SUPABASE_PROJECT_ID: fkezcibdjgbqyraxnmha
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  stage-web:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      deployment: ${{ steps.stage.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Stage production build without assigning domains
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_ORG_ID:?}" "${VERCEL_PROJECT_ID:?}" "${VERCEL_TOKEN:?}"
          deployment=$(vercel deploy --prod --skip-domain --yes --meta "releaseSha=$GITHUB_SHA")
          [[ "$deployment" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]
          echo "deployment=$deployment" >> "$GITHUB_OUTPUT"
          echo "Revisar el [build de producción preparado]($deployment) del commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"

  draft:
    needs: [candidate, windows, migration-plan, stage-web]
    if: >-
      !cancelled() && needs.candidate.result == 'success' && needs.migration-plan.result == 'success' &&
      needs.stage-web.result == 'success' && (needs.windows.result == 'success' ||
      (needs.candidate.outputs.version == '1.0.0' && needs.windows.result == 'skipped'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.draft.outputs.hashes }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.windows.result == 'success'
        with:
          name: signed-windows
          path: signed-windows
      - id: draft
        run: node .github/scripts/release.mjs draft
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish approved release
    needs: [draft, stage-web]
    if: "!cancelled() && needs.draft.result == 'success' && needs.stage-web.result == 'success'"
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      PRODUCTION_HOST: comunidad-cat-eight.vercel.app
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
      RELEASE_HASHES: ${{ needs.draft.outputs.hashes }}
      DEPLOYMENT: ${{ needs.stage-web.outputs.deployment }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node .github/scripts/release.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Verify staged project, SHA and build status
        run: bash .github/scripts/verify-vercel.sh "${DEPLOYMENT#https://}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - name: Prepare person-contacts in the approved production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: fkezcibdjgbqyraxnmha
        run: |
          supabase secrets list --project-ref "$PROJECT_REF" --output json | jq -e 'any(.[]; .name == "PERSON_CONTACT_KEY_V1")' >/dev/null
          supabase functions deploy person-contacts --project-ref "$PROJECT_REF" --use-api
      - name: Apply reviewed migrations
        uses: ./.github/actions/supabase-migrate
        with:
          apply: 'true'
        env:
          EXPECTED_SUPABASE_PROJECT_ID: fkezcibdjgbqyraxnmha
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: node .github/scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Promote the reviewed build
        run: |
          if bash .github/scripts/verify-vercel.sh "$PRODUCTION_HOST"; then
            echo "El dominio ya sirve el build aprobado."
          else
            vercel promote "$DEPLOYMENT" --yes
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify public web, release notes and installer download
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bash .github/scripts/verify-vercel.sh "$PRODUCTION_HOST"
          version=$(node -p "require('./caminomanager/package.json').version")
          release="https://github.com/$GITHUB_REPOSITORY/releases"
          tag="v$version"
          urls=("https://$PRODUCTION_HOST/login")
          if [[ "$version" == "1.0.0" ]]; then
            tag="web-v$version"
          else
            urls+=("$release/download/$tag/ComunidadCat-Cloud-$version-Setup.exe")
          fi
          urls+=("$release/tag/$tag")
          for url in "${urls[@]}"; do
            curl --fail --silent --show-error --head --location --retry 4 "$url" >/dev/null
          done
          echo "Migraciones aplicadas. [Web verificada](https://$PRODUCTION_HOST/login) · [Build promovido]($DEPLOYMENT) · [Release $version]($release/tag/$tag)." >> "$GITHUB_STEP_SUMMARY"
