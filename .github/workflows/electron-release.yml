name: Build signed Windows installers

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_PUBLISHABLE_DEFAULT_KEY:
        required: true
      WINDOWS_SIGNING_PFX:
        required: false
      WINDOWS_SIGNING_PASSWORD:
        required: false

      # The esigner job resolves these from the protected windows-signing environment.
      ESIGNER_ACCOUNT:
        required: false
      ESIGNER_TOTP_SECRET:
        required: false

permissions:
  contents: read

jobs:
  configure:
    permissions:
      actions: read
      contents: read
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    outputs:
      provider: ${{ steps.select.outputs.provider }}
    steps:
      - id: select
        env:
          PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER || 'pfx' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PROVIDER" in
            pfx)
              [[ "$GITHUB_EVENT_NAME" == push ]] || { echo 'Selecciona esigner antes de ejecutar el ensayo.'; exit 1; }
              ;;
            esigner)
              # Refuse to create an unprotected environment implicitly.
              endpoint="repos/$GITHUB_REPOSITORY/environments/windows-signing"
              gh api "$endpoint" | jq -e '.deployment_branch_policy.custom_branch_policies == true and
                any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)'
              gh api --paginate --slurp "$endpoint/deployment-branch-policies" | jq -e '
                [.[].branch_policies[] | [.type,.name]] | sort == [["branch","dev"],["branch","main"]]'
              ;;
            *) echo 'Proveedor de firma desconocido.'; exit 1 ;;
          esac
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"

  build-pfx:
    needs: configure
    if: needs.configure.outputs.provider == 'pfx'
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_PROVIDER: pfx
      WINDOWS_PUBLISHER_DN: ${{ vars.WINDOWS_PUBLISHER_DN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-installers
        with:
          cloud-url: ${{ secrets.SUPABASE_URL }}
          cloud-key: ${{ secrets.SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          pfx: ${{ secrets.WINDOWS_SIGNING_PFX }}
          pfx-password: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

  build-esigner:
    needs: configure
    if: needs.configure.outputs.provider == 'esigner'
    runs-on: windows-latest
    environment: windows-signing
    env:
      WINDOWS_SIGNING_PROVIDER: esigner
      WINDOWS_PUBLISHER_DN: ${{ vars.WINDOWS_PUBLISHER_DN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-installers
        with:
          cloud-url: ${{ secrets.SUPABASE_URL }}
          cloud-key: ${{ secrets.SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          esigner-account: ${{ secrets.ESIGNER_ACCOUNT }}
          esigner-totp: ${{ secrets.ESIGNER_TOTP_SECRET }}
          credential-id: ${{ vars.ESIGNER_CREDENTIAL_ID }}
