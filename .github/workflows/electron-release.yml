name: Build signed Windows installers

on:
  workflow_call:
    secrets:
      SUPABASE_URL:
        required: true
      SUPABASE_PUBLISHABLE_DEFAULT_KEY:
        required: true
      WINDOWS_SIGNING_PFX:
        required: true
      WINDOWS_SIGNING_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (Cloud + Standalone)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: caminomanager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caminomanager/package-lock.json

      - name: Check Cloud backend and signing configuration
        shell: pwsh
        env:
          CLOUD_URL: ${{ secrets.SUPABASE_URL }}
          CLOUD_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          PUBLISHER: ${{ vars.WINDOWS_PUBLISHER_DN }}
        run: |
          if ($env:CLOUD_URL.TrimEnd('/') -ne 'https://fkezcibdjgbqyraxnmha.supabase.co' -or !$env:CLOUD_KEY) {
            throw 'Comprueba el proyecto y la clave pública de la edición Cloud.'
          }
          if (!$env:PUBLISHER) { throw 'Configura WINDOWS_PUBLISHER_DN para firmar los instaladores.' }

      - run: npm ci

      - name: Test rejection of unsigned and differently signed files
        run: ./scripts/test-update-signature.ps1

      - name: Compile Electron TypeScript
        run: npx tsc -p electron/tsconfig.json

      # ── Phase 1: Cloud Build ──────────────────────────────────────────
      - name: Build Next.js (Cloud)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_DEFAULT_KEY }}

      - name: Build Electron installer (Cloud)
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_PUBLISHER_DN: ${{ vars.WINDOWS_PUBLISHER_DN }}
        run: ./scripts/build-signed-installer.ps1 -Edition Cloud

      - name: Move Cloud artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-cloud
          Move-Item -Path release/*.exe -Destination release-cloud/
          Move-Item -Path release/*.exe.blockmap -Destination release-cloud/
          Move-Item -Path release/latest.yml -Destination release-cloud/

      # ── Phase 2: Standalone Build ─────────────────────────────────────
      - name: Clean build output for Standalone
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue out
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue release

      - name: Build Next.js (Standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

      - name: Build Electron installer (Standalone)
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_PUBLISHER_DN: ${{ vars.WINDOWS_PUBLISHER_DN }}
        run: ./scripts/build-signed-installer.ps1 -Edition Standalone

      # ── Phase 3: Assemble Standalone ZIP ──────────────────────────────
      - name: Assemble Standalone ZIP
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $zipName = "ComunidadCat-Standalone-$version"
          $stageDir = "release/$zipName"

          # Create directory structure
          New-Item -ItemType Directory -Force -Path "$stageDir/deploy/scripts"
          New-Item -ItemType Directory -Force -Path "$stageDir/supabase/migrations"

          # Copy deploy scripts
          Copy-Item -Path "../deploy/Install-Prerequisites.ps1" -Destination "$stageDir/deploy/"
          Copy-Item -Path "../deploy/README-DEPLOY.md" -Destination "$stageDir/deploy/"
          Copy-Item -Path "../deploy/scripts/*" -Destination "$stageDir/deploy/scripts/"

          # Copy supabase config and migrations
          Copy-Item -Path "../supabase/config.toml" -Destination "$stageDir/supabase/"
          Copy-Item -Path "../supabase/seed.sql" -Destination "$stageDir/supabase/"
          Copy-Item -Path "../supabase/migrations/*.sql" -Destination "$stageDir/supabase/migrations/"

          # Copy standalone .exe into ZIP root
          Copy-Item -Path "release/ComunidadCat-Standalone-$version-Setup.exe" -Destination "$stageDir/"

          # Create ZIP
          Compress-Archive -Path "$stageDir" -DestinationPath "release/$zipName.zip"

      - name: Collect both editions for the release draft
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item -LiteralPath "release/ComunidadCat-Standalone-$version-Setup.exe" -Destination release-cloud/
          Copy-Item -LiteralPath "release/ComunidadCat-Standalone-$version.zip" -Destination release-cloud/
          node scripts/verify-cloud-update.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-windows
          path: caminomanager/release-cloud/
          if-no-files-found: error
          retention-days: 14
